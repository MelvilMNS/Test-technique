<div class="card p-3 mb-3">
  <h5>Réserver une table</h5>
  <div class="mb-2">
    <label for="size" class="form-label">Nombre de personnes</label>
    <input type="number" id="size" class="form-control" [(ngModel)]="size" min="1">
  </div>
  <button class="btn btn-primary" (click)="reservation()">Réserver</button>
  <p class="mt-2">
    @if (error) {
      <span class="text-danger">{{ message }}</span>
    } @else {
      <span class="text-success">{{ message }}</span>
    }
  </p>
</div>
